name: Auto Unzip and Commit (reusable)

on:
  workflow_call:
    secrets:
      PAT_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Détecter et extraire tous les fichiers .zip
        run: |
          set -e
          mapfile -t zips < <(find . -iname "*.zip" -not -path "./.git/*")

          if [ ${#zips[@]} -eq 0 ]; then
            echo "Aucun fichier .zip trouvé, rien à faire."
            exit 0
          fi

          for z in "${zips[@]}"; do
            dir=$(dirname "$z")
            echo "Extraction de $z dans $dir"
            unzip -o "$z" -d "$dir"
            rm -f "$z"

            # Corrige les permissions trop restrictives parfois stockées dans le zip
            chmod -R u+rwX,go+rX "$dir"
          done

      - name: Commit et push des fichiers extraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Rien à committer."
            exit 0
          fi

          git commit -m "Auto-extraction automatique du zip (${{ github.event.head_commit.message }})"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
