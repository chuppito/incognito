name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non bloquant)
        run: flutter analyze || true

      # Pas de clé de signature configurée pour l'instant -> build debug,
      # installable directement (mais pas publiable sur le Play Store en l'état).
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: incognito-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  # --- Build signé (release) --------------------------------------------
